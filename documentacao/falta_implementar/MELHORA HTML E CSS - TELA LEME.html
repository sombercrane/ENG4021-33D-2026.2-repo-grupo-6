MELHORA HTML E CSS - TELA LEME

<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Leme</title>
<style>
* {
  box-sizing: border-box;
}
body {
  font-family: Arial;
  max-width: 420px;
  margin: 0;
}
header {
  background: #1f2e24;
  color: white;
  padding: 20px;
}
header h1 {
  margin: 0 0 15px 0;
  text-align: center;
}
.sub {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.sub h2 {
  margin: 0;
  font-size: 18px;
}
.sub button {
  background: #3b4b40;
  color: white;
  border: none;
  padding: 10px;
  border-radius: 20px;
}
nav {
  display: flex;
  gap: 8px;
  padding: 12px;
  overflow-x: auto;
}
nav button {
  background: #efe9dd;
  border: none;
  padding: 10px 14px;
  border-radius: 20px;
  white-space: nowrap;
}
#mapa {
  position: relative;
  background: #e5ebe4;
  height: 260px;
}
.nome {
  position: absolute;
  top: 15px;
  left: 15px;
  margin: 0;
  background: #1f2e24;
  color: white;
  padding: 10px 14px;
  border-radius: 10px;
  font-size: 16px;
}
.predio {
  position: absolute;
  width: 50px;
  height: 45px;
  border-radius: 6px;
  background: #3f5a44;
  color: white;
  font-size: 10px;
  text-align: center;
  padding-top: 28px;
}
#rdc {
  top: 0;
  left: 120px;
}
#k {
  top: 40px;
  left: 300px;
}
#leme {
  top: 140px;
  left: 175px;
  width: 55px;
  height: 55px;
  background: #7d8b66;
  border: 3px solid #6b4a2b;
}
main {
  background: white;
  border-radius: 24px 24px 0 0;
  margin-top: -20px;
  position: relative;
  padding: 20px;
}
main h3 {
  font-size: 28px;
  margin: 5px 0 15px 0;
  color: #1f2e24;
}
.caixas {
  display: flex;
  gap: 10px;
}
.caixa {
  flex: 1;
  background: #efe9dd;
  border-radius: 16px;
  padding: 12px;
}
.caixa p {
  margin: 0 0 6px 0;
  color: #6b6b5e;
}
.dist {
  color: #6b6b5e;
  font-size: 14px;
}
.botoes {
  display: flex;
  gap: 10px;
}
.botoes button {
  flex: 1;
  padding: 16px;
  border-radius: 30px;
  font-size: 16px;
}
#verde {
  background: #2f4a34;
  color: white;
  border: none;
}
#branco {
  background: white;
  border: 1px solid #ddd;
}
</style>
</head>
<body>

<header>
  <h1>Localiza PUC</h1>
  <div class="sub">
    <h2>Mapa da PUC-Rio</h2>
    <button>Ver campus inteiro</button>
  </div>
</header>

<nav>
  <button>Entrada</button>
  <button>Elevador</button>
  <button>Escada</button>
  <button>Banheiro</button>
</nav>

<div id="mapa">
  <p class="nome">Prédio Leme</p>
  <div class="predio" id="rdc">RDC</div>
  <div class="predio" id="k">K</div>
  <div class="predio" id="leme">L</div>
</div>

<main>
  <p>Destino selecionado</p>
  <h3>Prédio Leme</h3>

  <div class="caixas">
    <div class="caixa">
      <p>Prédio</p>
      <b>Leme</b>
    </div>
    <div class="caixa">
      <p>Andar</p>
      <b>Térreo</b>
    </div>
    <div class="caixa">
      <p>Espaço</p>
      <b>L</b>
    </div>
  </div>

  <p class="dist">
    Distância e tempo estimado
    até o destino: 109 m ·
    1 min a pé
  </p>

  <div class="botoes">
    <button id="verde">
      Ver detalhes
    </button>
    <button id="branco">
      Ver andares
    </button>
  </div>
</main>

</body>
</html>
