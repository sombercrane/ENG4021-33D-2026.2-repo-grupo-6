{% load static %}

<div id="mapa-interativo" class="mapa-leaflet" role="region"
     aria-label="Mapa interativo do campus da PUC-Rio" hidden></div>

<img id="mapa-estatico" class="mapa-fallback"
     src="{% static 'IMG/Mapa-IMG.png' %}"
     alt="Mapa ilustrativo do campus da PUC-Rio">

<template id="mapa-cartao-local">
    <section class="mapa-local">
        <label class="mapa-local-escolha" hidden>
            Locais neste pin
            <select></select>
        </label>

        <h3 data-nome></h3>

        <dl>
            <dt>Tipo</dt>
            <dd data-tipo></dd>
            <dt>Prédio</dt>
            <dd data-predio></dd>
            <dt>Andar</dt>
            <dd data-andar></dd>
        </dl>
        <div class="mapa-local-acoes">
            <a data-ver-predio href="#">Ver prédio</a>
            <a data-ver-local hidden>Ver local</a>
            <a data-ver-rota href="#">Planejar trajeto</a>
        </div>
        <form method="post" data-rota-externa class="mapa-local-rota" hidden>
            {% csrf_token %}
            <input type="hidden" name="origem_latitude">
            <input type="hidden" name="origem_longitude">
            <input type="hidden" name="destino">
            <button type="submit" class="botao">Partir da origem no mapa</button>
        </form>
    </section>
</template>

{{ predios_mapa|json_script:"mapa-dados" }}
