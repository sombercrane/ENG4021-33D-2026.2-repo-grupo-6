{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Auditório RDC</title>
<link rel="stylesheet"
  href="{% static 'css/kennedy.css' %}">
</head>
<body>

<header>
  <h1>Localiza PUC</h1>
  <div class="sub">
    <h2>Mapa da PUC-Rio</h2>
    <button>Ver campus inteiro</button>
  </div>
</header>

<nav>
  <button>Entrada</button>
  <button>Elevador</button>
  <button>Escada</button>
  <button>Banheiro</button>
</nav>

<div id="mapa">
  <p class="nome">Auditório RDC</p>
  <div class="predio escuro alvo"
    style="top: 70px; left: 40px;">
    RDC
  </div>
  <div class="predio marrom"
    style="top: 40px; left: 270px;">
    IAG
  </div>
  <div class="predio oliva"
    style="top: 180px; left: 150px;">
    L
  </div>
</div>

<main>
  <p>Destino selecionado</p>
  <h3>Auditório RDC</h3>

  <div class="caixas">
    <div class="caixa">
      <p>Prédio</p>
      <b>RDC</b>
    </div>
    <div class="caixa">
      <p>Andar</p>
      <b>2º andar</b>
    </div>
    <div class="caixa">
      <p>Espaço</p>
      <b>RDC-200</b>
    </div>
  </div>

  <p class="dist">
    Distância e tempo estimado
    até o destino: 190 m ·
    3 min a pé
  </p>

  <div class="botoes">
    <button id="verde">
      Ver detalhes
    </button>
    <button id="branco">
      Ver andares
    </button>
  </div>
</main>

<footer>
  <span>Início</span>
  <span>Mapa</span>
</footer>

</body>
</html>
